<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de cálculo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, calm — same family as NeuroPlay
   IDEA: a reading passport — themes are islands, each level earns a sticker
   PICTURE: the kid's map of themes with sticker circles; the exercise card itself
   COLOUR and TYPE: NeuroPlay teal / orange / purple / coral on mint; Nunito
   LAYOUT: one column, big tap targets, stacks on phones */
:root{
  --teal:#1f7a78; --teal-d:#155e5c; --orange:#e8963a; --orange-d:#b8701f; --purple:#7a68b3; --purple-d:#5b4b93; --coral:#d9626b;
  --mint:#e7f3f1; --mint2:#d3ebe7; --ink:#1f2d3d; --muted:#5d6b7a; --line:#c9d6dd; --bg:#f7fbfa; --card:#fff;
  --ok:#2e9e6a; --r:18px;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding:0 16px 48px}
header.top{background:var(--mint);border-bottom:1px solid var(--mint2)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--teal-d)}
.brand small{font-size:14px;font-weight:900;color:var(--orange-d);background:#fff;border-radius:999px;padding:3px 10px;border:1px solid #f3dcb8}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.spacer{flex:1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--mint2);font-weight:800;font-size:15px;min-height:40px}
.pill:hover{background:#f2faf8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:900;font-size:18px;background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d);transition:transform .08s;min-height:48px;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal-d);border:2px solid var(--mint2);box-shadow:0 3px 0 var(--mint2)}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 var(--orange-d)}
.btn.purple{background:var(--purple);box-shadow:0 3px 0 var(--purple-d)}
.btn.coral{background:var(--coral);box-shadow:0 3px 0 #a9434b}
.btn.small{padding:9px 14px;font-size:15px;border-radius:12px;min-height:42px}
.btn[disabled]{opacity:.45;pointer-events:none}
.eyebrow{font-size:13px;font-weight:900;color:var(--teal)}
h1{font-size:30px;margin:4px 0 6px;font-weight:900;line-height:1.1;text-wrap:balance}
h2{font-size:22px;margin:0 0 8px;font-weight:900}
h3{font-size:18px;margin:0 0 6px;font-weight:900}
p{line-height:1.5}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:16px 0}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{padding:9px 14px;font-weight:800;font-size:15px;color:var(--muted);min-height:42px}
.seg button.on{background:var(--mint);color:var(--teal-d)}
/* hero */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--mint);z-index:0}
.hero>*{position:relative;z-index:1}
.big-avatar{width:110px;height:110px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:64px;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px var(--mint2)}
.today{flex:1;min-width:240px}
.stickers-count{font-weight:900;color:var(--orange-d)}
.ybar{height:14px;border-radius:999px;background:var(--mint);overflow:hidden;margin:10px 0 4px;max-width:380px}
.ybar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2fa39f);border-radius:999px}
/* themes */
.yearbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px}
.theme{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.theme.current{border-color:var(--teal);box-shadow:0 0 0 3px var(--mint2)}
.theme.complete{background:#f6fbf9}
.thead{display:flex;align-items:center;gap:10px}
.ticon{width:44px;height:44px;border-radius:14px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tname{font-weight:900;font-size:17px;line-height:1.2}
.tsub{font-size:13px;color:var(--muted);font-weight:700}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--mint);font-size:18px;margin-left:auto;flex:none}
.lvls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sbtn{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:var(--muted);background:#fff;position:relative}
.sbtn.done{border:2px solid var(--teal);background:var(--mint);font-size:22px}
.sbtn.next{border:3px solid var(--orange);color:var(--orange-d);animation:pulse 1.6s infinite}
.sbtn .st3{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--orange);letter-spacing:-1px;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,150,58,.45)}50%{box-shadow:0 0 0 7px rgba(232,150,58,0)}}
.theme.rev{background:linear-gradient(135deg,#f1edfb,#fff7ec);border-color:#d8cfee}
.theme.rev .ticon{background:#fff}
.theme.rev.done{border-color:var(--purple)}
.revgames{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.revgames span{background:#fff;border:1px solid #e1d9f3;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;color:var(--purple-d)}
/* play */
.sess-head{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.prog{display:flex;gap:6px;margin-top:12px}
.prog i{flex:1;height:10px;border-radius:999px;background:var(--mint2)}
.prog i.ok{background:var(--ok)}.prog i.meh{background:var(--orange)}.prog i.cur{background:var(--teal)}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px}
.instr{display:flex;align-items:flex-start;gap:10px;font-size:17px;font-weight:800;color:var(--teal-d);background:var(--mint);border-radius:14px;padding:10px 12px}
.say{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;color:var(--teal-d);padding:6px 10px;border-radius:10px;background:#fff;font-size:15px;flex:none;min-height:36px;border:1px solid var(--mint2)}
.prompt{font-size:30px;font-weight:900;line-height:1.3;margin:22px 0 18px;text-align:center;text-wrap:balance}
.prompt.long{font-size:23px;text-align:left}
.prompt .clue{display:block;font-size:17px;color:var(--muted);font-weight:800;margin-top:6px}
.blank{display:inline-block;min-width:1.8em;border-bottom:4px solid var(--orange);color:var(--orange-d);text-align:center;margin:0 2px;line-height:1}
.blank.filled{color:var(--ok);border-color:var(--ok)}
.pic{font-size:96px;text-align:center;line-height:1.1;margin:10px 0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;max-width:640px;margin:0 auto}
.opts.wide{grid-template-columns:1fr}
.opt{padding:16px 12px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:24px;box-shadow:0 3px 0 var(--line);min-height:62px;line-height:1.25}
.opts.wide .opt{font-size:19px;text-align:left;padding:14px 16px}
.opt:hover{border-color:var(--teal)}
.opt.ok{border-color:var(--ok);background:#e8f7ef;color:#1d6b46;box-shadow:0 3px 0 #9fd6b8}
.opt.no{border-color:var(--orange);background:#fff6ea;color:#a5621a;opacity:.7}
.opt[disabled]{pointer-events:none}
.wobble{animation:wob .35s}
@keyframes wob{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{display:none;align-items:center;gap:12px;border-radius:16px;padding:12px 16px;font-weight:900;font-size:19px;margin-top:16px;flex-wrap:wrap}
.feedback.show{display:flex}
.feedback.good{background:#e8f7ef;border:1px solid #bfe6d0;color:#1d6b46}
.feedback.try{background:#fff6ea;border:1px solid #f3dcb8;color:#a5621a}
.feedback .spacer{min-width:8px}
.passage{background:#fffdf7;border:1px solid #f0e3c6;border-radius:16px;padding:16px 18px;margin-top:14px}
.passage h3{display:flex;align-items:center;gap:8px}
.passage p{font-size:19px;line-height:1.65;margin:6px 0 0}
/* tiles (order) */
.answer-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;padding:12px;border:2px dashed #9fb3bd;border-radius:16px;background:#fbfdfd;margin:8px 0 14px;align-items:center}
.answer-row.ok{border:2px solid var(--ok);background:#effaf4}
.answer-row.no{border-color:var(--orange);background:#fff6ea}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{padding:12px 16px;border-radius:14px;background:#fff;border:2px solid var(--teal);color:var(--teal-d);font-weight:900;font-size:24px;box-shadow:0 3px 0 var(--mint2);min-height:56px;min-width:56px}
.tile.used{visibility:hidden}
.answer-row .tile{border-color:var(--orange);color:#8a4f12;box-shadow:0 3px 0 #f3dcb8}
.train .answer-row{justify-content:flex-start}
.train .answer-row::before{content:"🚂";font-size:40px}
.train .answer-row .tile{border-radius:10px 10px 18px 18px}
/* split */
.splitword{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;margin:24px 0 10px;font-size:44px;font-weight:900}
.splitword .ch{padding:0 1px}
.gap{width:26px;height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:transparent;position:relative}
.gap::before{content:"";width:4px;height:26px;border-radius:2px;background:var(--mint2)}
.gap:hover::before{background:var(--teal)}
.gap.on::before{display:none}
.gap.on{color:var(--orange);font-size:44px}
.gap.on::after{content:"-"}
/* read aloud */
.readbox{font-size:40px;font-weight:900;text-align:center;line-height:1.35;padding:26px 14px;background:#fffdf7;border:1px solid #f0e3c6;border-radius:20px;margin:18px 0;text-wrap:balance}
.readbox.sent{font-size:28px}
/* end */
.finish{text-align:center}
.bigsticker{width:150px;height:150px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:84px;background:#fff8ee;border:5px solid var(--orange);animation:pop .6s}
.bigsticker.gold{background:radial-gradient(circle at 35% 30%,#fff9da,#ffe08a);border-color:#d4a514}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg)}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1)}}
.stars{font-size:44px;letter-spacing:6px;color:#f0b429}
.stars .off{color:#e2e8ec}
/* review games */
.sky{position:relative;height:360px;border-radius:20px;background:linear-gradient(#dff1f7,#f4fbfd);overflow:hidden;border:1px solid var(--line)}
.balloon{position:absolute;bottom:-10px;width:120px;display:flex;flex-direction:column;align-items:center;animation:rise 3.6s ease-in-out infinite alternate}
.balloon b{display:flex;align-items:center;justify-content:center;width:100%;max-width:120px;height:128px;border-radius:50% 50% 48% 48%;color:#fff;font-weight:900;font-size:20px;padding:10px;text-align:center;box-shadow:inset -10px -12px 0 rgba(0,0,0,.08);line-height:1.15;word-break:break-word}
.balloon i{width:2px;height:50px;background:#9fb0c4}
.balloon.pop{animation:popb .35s forwards}
.balloon.shake b{animation:wob .35s}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-150px)}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:560px;margin:14px auto 0}
.mcard{aspect-ratio:3/3.4;border-radius:16px;border:2px solid var(--line);background:repeating-linear-gradient(45deg,#e7f3f1,#e7f3f1 10px,#d3ebe7 10px,#d3ebe7 20px);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;line-height:1.15;word-break:break-word;transition:transform .2s}
.mcard.up{background:#fff;border-color:var(--teal)}
.mcard.up.b{border-color:var(--orange);background:#fff8ee}
.mcard.big{font-size:40px}
.mcard.done{background:#e8f7ef;border-color:var(--ok);opacity:.75}
.mcard:not(.up) span{visibility:hidden}
.tfcard{font-size:28px;font-weight:900;text-align:center;padding:26px 16px;border-radius:20px;background:#fffdf7;border:1px solid #f0e3c6;margin:16px 0;line-height:1.35;text-wrap:balance}
.tfcard .cand{color:var(--purple-d);background:#efeafb;border-radius:8px;padding:0 6px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:0 auto}
.tfbtns .btn{font-size:22px;padding:18px}
.gamechip{display:inline-flex;align-items:center;gap:6px;background:#efeafb;color:var(--purple-d);border-radius:999px;padding:6px 12px;font-weight:900}
/* album */
.album-sec{margin-top:18px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;color:#c3ced4;font-weight:900;background:#fff}
.slot.have{border:3px solid var(--orange);background:#fff8ee;animation:none}
.slot.have.gold{border-color:#d4a514;background:radial-gradient(circle at 35% 30%,#fff9da,#ffe08a)}
.slot.new{animation:pop .6s}
/* profiles */
.kids{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:18px}
.kid{display:flex;flex-direction:column;align-items:center;gap:6px;width:160px;padding:18px 10px;border-radius:20px;background:#fff;border:2px solid var(--line);transition:transform .1s}
.kid:hover{transform:translateY(-2px);border-color:var(--teal)}
.kid.add{border-style:dashed;color:var(--teal-d);justify-content:center}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900}
.kname{font-weight:900;font-size:19px}
.kcount{font-size:13px;color:var(--orange-d);font-weight:800}
.kage{font-size:13px;font-weight:800;color:var(--teal-d)}
.animals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.animals button{font-size:28px;padding:6px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:48px}
.animals button.on{border:3px solid var(--orange);background:#fff8ee}
input.txt,select.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
.agechips{display:flex;gap:6px;flex-wrap:wrap}
.agechips button{padding:0 14px;height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:16px}
.agechips button.on{border:3px solid var(--orange);background:#fff8ee;color:#a5621a}
label.f{display:block;font-weight:900;margin:14px 0 6px}
/* grown-ups */
.gutabs{margin:16px 0 4px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:var(--mint);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:28px;font-weight:900;color:var(--teal-d);line-height:1.1}
.stat span{font-size:14px;font-weight:800;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid #e3eaee;text-align:left;vertical-align:middle}
table.t th{font-size:13px;color:var(--muted)}
table.t td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--mint);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.bar i.mid{background:var(--orange)}.bar i.low{background:var(--coral)}
.kidrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.grownup{background:#fff8ee;border:1px solid #f3dcb8;border-radius:14px;padding:12px 14px;font-size:15px;margin-top:14px;line-height:1.5}
.grownup b{color:#a5621a}
.gu ul{padding-left:20px;line-height:1.6}
.toggle{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #edf2f4;font-weight:800}
.toggle input{width:22px;height:22px;accent-color:var(--teal)}
textarea.txt{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,monospace}
.status{font-size:13px;color:var(--muted);font-weight:700}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,40,50,.38);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:70}
footer{margin-top:30px;font-size:13px;color:var(--muted);text-align:center}
/* print sheet preview */
.printbar{display:grid;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
.paperwrap{overflow-x:auto;padding:10px 0}
.paper{width:794px;max-width:none;margin:0 auto;background:#fff;box-shadow:0 2px 14px rgba(20,40,50,.14);border-radius:4px}
@media (max-width:840px){.paperwrap{zoom:.62}}
@media (max-width:560px){.paperwrap{zoom:.44}}
@media (max-width:560px){
  h1{font-size:25px}.panel{padding:16px}.prompt{font-size:26px}.prompt.long{font-size:20px}
  .big-avatar{width:84px;height:84px;font-size:48px}.brand{font-size:19px}
  .kid{width:140px}.opt{font-size:21px}.readbox{font-size:32px}.readbox.sent{font-size:23px}
  .splitword{font-size:34px}.gap{width:20px;height:50px}.gap.on{font-size:34px}
  .balloon b{height:104px;font-size:16px}.sky{height:330px}
  .mem{gap:7px}.mcard{font-size:16px}.mcard.big{font-size:32px}
  .tfcard{font-size:23px}.pic{font-size:80px}
}
@media print{@page{size:A4;margin:10mm}body.printing header.top,body.printing footer,body.printing .sess-head,body.printing .printbar,body.printing .modal-bg,body.printing .confetti{display:none!important}body.printing{background:#fff}body.printing .wrap{padding:0;max-width:none}body.printing .paperwrap{zoom:1!important;padding:0;overflow:visible}body.printing .paper{width:auto;box-shadow:none}body.printing .sh{padding:0!important}}

/* number answers + keypad */
.numrow{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.numin{width:min(260px,70vw);font:900 34px Nunito,system-ui,sans-serif;text-align:center;padding:10px 12px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.numin.ok{border-color:var(--ok);background:#effaf3}.numin.no{border-color:var(--coral);background:#fdf0f1}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:360px;margin:0 auto}
.pad button{min-height:56px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:900;font-size:24px;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pad .go{grid-column:span 2;background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 0 var(--teal-d);font-size:20px}
.pad .del{color:var(--coral)}
.prompt .blank{min-width:1.6em}
/* calculator */
.calc{position:fixed;right:16px;bottom:16px;z-index:65;width:300px;max-width:calc(100vw - 24px);background:#23313f;color:#fff;border-radius:22px;padding:14px;box-shadow:0 14px 40px rgba(20,40,50,.35)}
.calc .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:900}
.calc .ch b{flex:1;font-size:16px}
.calc .x{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:18px}
.calc .scr{background:#dfeee0;color:#1f2d3d;border-radius:14px;padding:8px 12px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.calc .ex{font-size:17px;font-weight:800;color:#4f6a5a;min-height:22px;word-break:break-all}
.calc .res{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;word-break:break-all}
.calc .res.err{font-size:17px;color:#a9434b}
.calc .keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}
.calc .keys button{min-height:50px;border-radius:12px;background:#3a4a5a;color:#fff;font-weight:900;font-size:22px;box-shadow:0 3px 0 #17222c}
.calc .keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #17222c}
.calc .keys .op{background:var(--orange);box-shadow:0 3px 0 var(--orange-d)}
.calc .keys .eq{background:var(--teal);box-shadow:0 3px 0 var(--teal-d)}
.calc .keys .fn{background:#5d6b7a}
.calc .note{font-size:13px;color:#c8d4dc;margin-top:8px;font-weight:700;line-height:1.35}
@media (max-width:560px){.calc{right:8px;left:8px;bottom:8px;width:auto}.numin{font-size:28px}.pad button{min-height:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function nextLevel(a){const p=P();for(const e of YEARS[a]){if(e.type==='theme'){for(const k of e.levels)if(!p.lv[k])return k}else if(!p.lv[e.key]&&e.key&&RV[e.key].groups.every(g=>YEARS[a].find(x=>x.g===g).levels.some(k=>p.lv[k])))return e.key}return null}
function missed(p){p=p||P();return Object.keys(p.it).filter(id=>p.it[id][2]===0&&IT[id]&&kindOf(IT[id].g)!=='read')}

/* item helpers */
function answerText(it){if(typeof it.a==='number')return it.o[it.a];return it.a}
function picWord(it){let w=answerText(it);w=w.replace(/^Vejo uma? /,'').replace(/\.$/,'');return w}
function promptHTML(it,fill){
  let p=esc(it.p),clue='';
  const m=p.match(/^(.*?) — (.*)$/);if(m){p=m[1];clue=m[2]}
  p=p.replace(/_{2,}/g,()=>fill!=null?`<span class="blank filled">${esc(fill)}</span>`:'<span class="blank">&nbsp;?&nbsp;</span>');
  return p+(clue?`<span class="clue">${clue}</span>`:'');
}
function doneText(it){const ans=answerText(it);const m=it.p.split(' — ')[0];if(/_{2,}/.test(m)&&m.length<48&&!/[🍎⭐🐟🎈🌼🚗🐞🍓⚽🐥🍪🦋🔴🔵🟡🟢🟣🟠❤️🔺🟦]/u.test(m))return m.replace(/_{2,}/,ans);return ans}
const toNum=s=>{s=String(s).replace(/[\s\u00a0]/g,'').replace(',','.');return s===''||!/^-?\d*\.?\d+$/.test(s)?NaN:parseFloat(s)};
const sameNum=(a,b)=>!isNaN(a)&&!isNaN(b)&&Math.abs(a-b)<1e-9;
function rec(id,okFirst){const p=P();const r=p.it[id]||[0,0,0];r[0]++;if(okFirst)r[1]++;r[2]=okFirst?1:0;p.it[id]=r}
const norm=s=>s.toLowerCase().replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').trim();

let VIEW='kids',RUN=null,MAPYEAR=null;
function go(v,arg){VIEW=v;try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}window.scrollTo(0,0);header();

function header(){const k=kid(),b=$('#kidBtn');if(k&&VIEW!=='kids'&&VIEW!=='adults'){b.style.display='';b.innerHTML=`<span style="font-size:20px">${k.av}</span>${esc(k.name)}`}else b.style.display='none';$('#soundBtn').textContent=S.settings.voice||S.settings.sfx?'🔊':'🔇';$('#guBtn').textContent=VIEW==='adults'?'⬅ Voltar':'Para adultos';$('#calcBtn').style.display=S.settings.calc||VIEW==='adults'?'':'none'}

$('#kidBtn').onclick=()=>go('kids');

$('#soundBtn').onclick=()=>{const on=!(S.settings.voice||S.settings.sfx);S.settings.voice=on;S.settings.sfx=on;save();header();toast(on?'Som ligado':'Som desligado')};
$('#guBtn').onclick=()=>{if(VIEW==='adults'){go(kid()?'map':'kids');return}gate(()=>go('adults'))};

function modal(html,onMount){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(bg);const close=()=>bg.remove();bg.addEventListener('click',e=>{if(e.target===bg)close()});onMount&&onMount(bg.firstChild,close);return close}
function gate(ok){const a=3+Math.floor(Math.random()*6),b=4+Math.floor(Math.random()*6);
  modal(`<div class="eyebrow">Área para adultos</div><h2>Pergunta de adulto</h2><p class="muted">Para entrar, escreve o resultado:</p><p style="font-size:28px;font-weight:900;margin:8px 0">${a} × ${b} = ?</p><input class="txt" id="gIn" inputmode="numeric" autocomplete="off"><div class="row-btns" style="margin-top:14px"><button class="btn" id="gOk">Entrar</button><button class="btn alt" id="gNo">Cancelar</button></div><p class="status" id="gMsg"></p>`,(m,close)=>{
    const i=m.querySelector('#gIn');i.focus();const t=()=>{if(+i.value===a*b){close();ok()}else{m.querySelector('#gMsg').textContent='Não é bem isso. Tenta outra vez.';i.value=''}};
    m.querySelector('#gOk').onclick=t;i.onkeydown=e=>{if(e.key==='Enter')t()};m.querySelector('#gNo').onclick=close})}

/* ============ map ============ */
function viewMap(){
  const k=kid();if(!k){go('kids');return}const p=P();const a=MAPYEAR||k.ano;
  const all=themeLevels(a),done=all.filter(x=>p.lv[x]).length;const nxt=nextLevel(a);const nm=missed().length;
  const stk=p.st.length+p.gold.length;
  let curMarked=false;
  const cards=YEARS[a].map(e=>{
    if(e.type==='rev'){const r=RV[e.key],d=p.lv[e.key];const isN=nxt===e.key;
      return`<div class="theme rev ${d?'done':''} ${isN?'current':''}"><div class="thead"><span class="ticon">${d?d.st:'🎪'}</span><div><div class="tname">${r.last?'Grande revisão':'Revisão '+r.n}</div><div class="tsub">${r.last?'Jogos com todos os temas do '+r.ano+'.º ano':'Jogos com '+r.groups.map(g=>GN[g]).join(', ')}</div></div></div>
      <div class="revgames">${revGames(r).map(gm=>`<span>${GAME_INFO[gm][0]} ${GAME_INFO[gm][1]}</span>`).join('')}</div>
      <button class="btn ${d?'alt':'purple'} small" data-rev="${e.key}">${d?'Jogar outra vez':'Jogar revisão'} ${d?'⭐'.repeat(d.s):''}</button></div>`}
    const lv=e.levels,dn=lv.filter(x=>p.lv[x]).length;const cur=!curMarked&&lv.includes(nxt);if(cur)curMarked=true;
    return`<div class="theme ${cur?'current':''} ${dn===lv.length?'complete':''}"><div class="thead"><span class="ticon">${GICON[e.g]}</span><div><div class="tname">${esc(GN[e.g])}</div><div class="tsub">${dn} de ${lv.length} níveis</div></div><button class="iconbtn" data-print="${e.g}" aria-label="Ficha para imprimir" title="Ficha para imprimir">🖨</button></div>
    <div class="lvls">${lv.map(x=>{const d=p.lv[x];return`<button class="sbtn ${d?'done':''} ${x===nxt?'next':''}" data-lv="${x}" aria-label="Nível ${LV[x].n}">${d?d.st:LV[x].n}${d?`<span class="st3">${'★'.repeat(d.s)}</span>`:''}</button>`}).join('')}</div></div>`}).join('');
  app.innerHTML=`<section class="hero"><div class="big-avatar">${k.av}</div><div class="today"><div class="eyebrow">${a}.º ano · ${done} de ${all.length} níveis</div><h1>Olá, ${esc(k.name)}!</h1>
  <div class="ybar"><i style="width:${all.length?Math.round(done/all.length*100):0}%"></i></div>
  <p style="margin:4px 0 12px">Tens <span class="stickers-count">${stk} autocolante${stk===1?'':'s'}</span> na tua caderneta.</p>
  <div class="row-btns">${nxt?`<button class="btn orange" id="goNext">▶ ${p.lv[nxt]||Object.keys(p.lv).length?'Continuar':'Começar'}</button>`:`<span class="pill">🎉 Ano completo!</span>`}
  ${nm>=3?`<button class="btn coral small" id="goHard">🎯 Contas difíceis (${nm})</button>`:''}
  <button class="btn alt small" id="goAlbum">📒 Caderneta</button><button class="btn alt small" id="goPrint">🖨 Fichas em papel</button></div></div></section>
  <div class="yearbar"><h2 style="margin:0">O meu mapa</h2><div class="seg" role="group" aria-label="Ano">${[1,2,3,4].map(n=>`<button data-yr="${n}" class="${n===a?'on':''}">${n}.º ano</button>`).join('')}</div></div>
  <div class="themes">${cards}</div>`;
  const gn=$('#goNext');if(gn)gn.onclick=()=>nxt[0]==='R'?startReview(nxt):startLevel(nxt);
  const gh=$('#goHard');if(gh)gh.onclick=startHard;
  $('#goAlbum').onclick=()=>go('album');$('#goPrint').onclick=()=>go('print',{ano:a});
  app.querySelectorAll('[data-yr]').forEach(b=>b.onclick=()=>{MAPYEAR=+b.dataset.yr;viewMap()});
  app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>startLevel(b.dataset.lv));
  app.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>startReview(b.dataset.rev));
  app.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>go('print',{ano:a,g:b.dataset.print}));
  const cur=app.querySelector('.theme.current');if(cur&&done>3)setTimeout(()=>cur.scrollIntoView({block:'center',behavior:'smooth'}),150);
}

/* ============ play: levels ============ */
function startLevel(key){const lv=LV[key];RUN={mode:'level',key,title:GN[lv.g]+' · nível '+lv.n,g:lv.g,ids:lv.items.slice(),i:0,res:[]};VIEW='play';header();showItem()}
function startHard(){const ids=shuffle(missed()).slice(0,8);if(!ids.length)return;RUN={mode:'hard',key:'hard',title:'Desafio das contas difíceis',ids,i:0,res:[]};VIEW='play';header();showItem()}
function playShell(inner,extra=''){
  const n=RUN.ids.length;
  app.innerHTML=`<div class="sess-head"><button class="btn alt small" id="quit">✕ Sair</button><div style="flex:1"><div class="eyebrow">${esc(RUN.title)}</div><div class="prog">${RUN.ids.map((_,i)=>`<i class="${i<RUN.res.length?(RUN.res[i]?'ok':'meh'):i===RUN.i?'cur':''}"></i>`).join('')}</div></div><span class="pill">${RUN.i+1} / ${n}</span></div>${extra}<div class="panel" id="panel">${inner}</div>`;
  $('#quit').onclick=()=>{if(RUN.res.length&&RUN.mode!=='hard'){modal(`<h2>Queres sair?</h2><p class="muted">O progresso deste nível não fica guardado.</p><div class="row-btns"><button class="btn" id="mStay">Continuar a jogar</button><button class="btn alt" id="mGo">Sair</button></div>`,(m,c)=>{m.querySelector('#mStay').onclick=c;m.querySelector('#mGo').onclick=()=>{c();RUN=null;go('map')}})}else{RUN=null;go('map')}};
  bindSay();
}
function bindSay(){app.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say)})}
function showItem(){
  const id=RUN.ids[RUN.i],it=IT[id],g=it.g,kind=kindOf(g),ins=BANK.groups[g].ins;
  RUN.tries=0;
  let passage='';
  if(it.t){const T=BANK.texts[it.t];passage=`<div class="passage"><h3>📖 ${esc(T.title)} ${sayBtn(T.title+'. '+T.text,'🔊 Ouvir o texto')}</h3><p>${esc(T.text)}</p></div>`}
  const head=`<div class="instr"><span style="flex:1">${esc(ins)}</span>${sayBtn(ins)}</div>${RUN.mode==='hard'?`<div class="status" style="margin-top:6px">${GICON[g]} ${esc(GN[g])} · ${g[0]}.º ano</div>`:''}`;
  let body='';
  if(kind==='choice'||kind==='pic'){
    const long=it.o.some(o=>o.length>18)||it.o.length>4&&it.o.some(o=>o.length>8);
    const pl=it.p.length>40;
    body=(kind==='pic'?`<div class="pic">${PIC[picWord(it)]||'❔'}</div><div class="prompt" style="font-size:22px;margin-top:0">${esc(it.p)}</div>`:`<div class="prompt ${pl?'long':''}" id="pr">${promptHTML(it)}</div>`)+
      (false?'<p class="muted" style="text-align:center;margin-top:-6px">👏 Diz a palavra e bate uma palma por cada sílaba.</p>':'')+
      `<div class="opts ${long?'wide':''}">${it.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  }else if(kind==='order'){
    const [raw,clue]=it.p.split(' — ');const parts=raw.split(' / ');let order=shuffle(parts.map((_,i)=>i));
    RUN.parts=parts;RUN.placed=[];RUN.order=order;
    body=`<div class="prompt" style="font-size:20px;color:var(--muted)">${clue?esc(clue):false?'':g==='2.10'?'Toca nas palavras pela ordem certa.':'Toca nas sílabas pela ordem certa.'}</div>
    <div class="answer-row" id="ar"></div><div class="tiles" id="tl">${order.map(i=>`<button class="tile" data-t="${i}">${esc(parts[i])}</button>`).join('')}</div>
    <div class="row-btns" style="justify-content:center;margin-top:14px"><button class="btn alt small" id="undo">↩ Desfazer</button><button class="btn" id="chk" disabled>Verificar</button></div>`;
  }else if(kind==='split'){
    const w=[...it.p];RUN.gaps=new Set();
    body=`<div class="prompt" style="font-size:19px;color:var(--muted);margin-bottom:0">Toca entre as letras onde a palavra se divide.</div><div class="splitword">${w.map((c,i)=>`<span class="ch">${esc(c)}</span>${i<w.length-1?`<button class="gap" data-gp="${i}" aria-label="Dividir depois de ${esc(c)}"></button>`:''}`).join('')}</div>
    <div class="row-btns" style="justify-content:center;margin-top:10px"><button class="btn" id="chk">Verificar</button></div>`;
  }else if(kind==='num'){
    body=`<div class="prompt ${it.p.length>40?'long':''}" id="pr">${promptHTML(it)}</div>
    <div class="numrow"><input class="numin" id="numIn" inputmode="none" autocomplete="off" aria-label="A tua resposta" placeholder="?"></div>
    <div class="pad" id="pad">${['7','8','9','⌫','4','5','6',',','1','2','3','0'].map(k=>`<button data-k="${k}" class="${k==='⌫'?'del':''}" aria-label="${k==='⌫'?'Apagar':k}">${k}</button>`).join('')}<button class="go" id="chk" style="grid-column:1 / -1">Verificar ✓</button></div>`;
  }else{
    body=`<div class="readbox ${it.p.length>16?'sent':''}">${esc(it.p)}</div><div class="row-btns" style="justify-content:center">${sayBtn(it.p,'🔊 Ouvir como se lê')}</div>
    <p class="muted" style="text-align:center">Lê em voz alta para um adulto ou para ti. Depois escolhe:</p>
    <div class="tfbtns"><button class="btn" id="rdOk">😃 Já li bem!</button><button class="btn alt" id="rdHelp">🤔 Foi difícil</button></div>`;
  }
  playShell(head+body+`<div class="feedback" id="fb"></div>`,passage);
  if(S.settings.autoInstr&&RUN.i===0)speak(ins);
  if(kind==='choice'||kind==='pic')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerChoice(it,+b.dataset.i,b));
  if(kind==='order')bindOrder(it);
  if(kind==='num')bindNum(it);
  if(kind==='split')bindSplit(it);
  if(kind==='read'){$('#rdOk').onclick=()=>{rec(id,true);finishItem(true,true)};$('#rdHelp').onclick=()=>{const p=P();if(!p.help.includes(id))p.help.push(id);rec(id,true);RUN.res.push(true);toast('Boa! Vamos treinar mais esta.');next()}}
}
function feedback(cls,html){const f=$('#fb');f.className='feedback show '+cls;f.innerHTML=html;bindSay()}
function answerChoice(it,i,b){
  if(i===it.a){b.classList.add('ok');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    const ans=it.o[it.a],full=it.full||'';const pr=$('#pr');if(pr&&/_{2,}/.test(it.p))pr.innerHTML=promptHTML(it,ans);
    finishItem(RUN.tries===0,false,doneText(it));
  }else{RUN.tries++;b.classList.add('no','wobble');b.disabled=true;beep('no');
    if(RUN.tries>=2){app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===it.a)x.classList.add('ok')});const pr=$('#pr');if(pr&&/_{2,}/.test(it.p))pr.innerHTML=promptHTML(it,it.o[it.a]);reveal(it,it.o[it.a])}
    else feedback('try','🤔 '+pick(RETRY))}
}
function reveal(it,ans){rec(it.id,false);RUN.res.push(false);const w=kindOf(it.g)==='order'?ans:doneText(it);feedback('try',`💡 A resposta certa é: <b>${esc(w)}</b><span class="spacer" style="flex:1"></span>${sayBtn(w)}${calcChk(it)}<button class="btn small" id="nx">Continuar ➜</button>`);bindCalcChk(it);$('#nx').onclick=next;$('#nx').focus()}
const calcChk=it=>it&&it.x&&S.settings.calc?`<button class="btn alt small" id="cchk">🧮 Confirmar na calculadora</button>`:'';
function bindCalcChk(it){const b=$('#cchk');if(b)b.onclick=()=>openCalc(it.x,RUN&&RUN.lastIn)}
function bindNum(it){
  const inp=$('#numIn'),chk=$('#chk');RUN.lastIn='';
  const put=k=>{if(inp.disabled)return;inp.classList.remove('no');if(k==='⌫')inp.value=inp.value.slice(0,-1);else if(inp.value.length<12)inp.value+=k;};
  app.querySelectorAll('#pad [data-k]').forEach(b=>b.onclick=()=>{put(b.dataset.k);});
  inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9,.\s]/g,'').replace('.',',');inp.classList.remove('no')});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();chk.click()}});
  setTimeout(()=>{try{if(matchMedia('(pointer:fine)').matches)inp.focus()}catch(e){}},50);
  chk.onclick=()=>{
    const v=toNum(inp.value);if(isNaN(v)){feedback('try','✏️ Escreve primeiro a tua resposta.');return}
    RUN.lastIn=inp.value;
    if(sameNum(v,toNum(it.a))){inp.classList.add('ok');inp.disabled=true;app.querySelectorAll('#pad button').forEach(x=>x.disabled=true);const pr=$('#pr');if(pr)pr.innerHTML=promptHTML(it,it.a);finishItem(RUN.tries===0,false,doneText(it))}
    else{RUN.tries++;beep('no');inp.classList.add('no','wobble');setTimeout(()=>inp.classList.remove('wobble'),400);
      if(RUN.tries>=2){inp.disabled=true;app.querySelectorAll('#pad button').forEach(x=>x.disabled=true);const pr=$('#pr');if(pr)pr.innerHTML=promptHTML(it,it.a);reveal(it,it.a)}
      else{feedback('try','🤔 '+pick(RETRY)+(it.x&&S.settings.calc?' Podes refazer a conta no caderno.':''));inp.select&&inp.select()}}
  };
}

/* ============ calculator ============ */
let CALC=null;
function fmtN(n){if(!isFinite(n))return'';let s=(Math.round(n*1e6)/1e6).toString();if(/e/.test(s))s=n.toPrecision(10);let[i,d]=s.split('.');const neg=i[0]==='-';if(neg)i=i.slice(1);if(i.length>4)i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');return(neg?'−':'')+i+(d?','+d:'')}
function calcEval(src){

function gTrain(){
  const items=takeFrom(it=>kindOf(it.g)==='order',3);let k=0;
  const round=()=>{if(k>=items.length){gameDone();return}const it=items[k];const [raw,clue]=it.p.split(' — ');const parts=raw.split(' / ');let placed=[],tries=0;const order=shuffle(parts.map((_,i)=>i));
    const alpha=true,words=false;
    revShell(`<div class="instr"><span style="flex:1">Monta o comboio pela ordem certa! (${k+1}/${items.length}) ${clue?' — '+esc(clue):''}</span>${sayBtn('Monta o comboio pela ordem certa!')}</div>
    <div class="train"><div class="answer-row" id="ar"></div></div><div class="tiles" id="tl">${order.map(i=>`<button class="tile" data-t="${i}">${esc(parts[i])}</button>`).join('')}</div>
    <div class="row-btns" style="justify-content:center;margin-top:14px"><button class="btn alt small" id="undo">↩ Desfazer</button></div><div class="feedback" id="fb"></div>`);
    const ar=$('#ar');
    const draw=()=>{ar.innerHTML=placed.map(t=>`<span class="tile">${esc(parts[t])}</span>`).join('');app.querySelectorAll('#tl .tile').forEach(b=>b.classList.toggle('used',placed.includes(+b.dataset.t)));
      if(placed.length===parts.length){const got=placed.map(t=>parts[t]);const s=alpha?got.join(' / '):words?got.join(' '):got.join('');
        if(norm(s)===norm(it.a)){ar.classList.add('ok');beep('ok');RUN.n++;if(!tries)RUN.ok++;rec(it.id,!tries);feedback('good',`🚂 Tchu-tchu! ${pick(PRAISE)} <span class="spacer" style="flex:1"></span><button class="btn small" id="nx">Continuar ➜</button>`);$('#nx').onclick=()=>{k++;round()}}
        else{tries++;beep('no');ar.classList.add('no');if(tries>=2){RUN.n++;rec(it.id,false);feedback('try',`💡 Fica assim: <b>${esc(it.a)}</b><span class="spacer" style="flex:1"></span><button class="btn small" id="nx">Continuar ➜</button>`);$('#nx').onclick=()=>{k++;round()}}else{setTimeout(()=>{placed=[];ar.classList.remove('no');draw()},700)}}}};
    app.querySelectorAll('#tl .tile').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;if(!placed.includes(t)&&placed.length<parts.length){placed.push(t);draw()}});
    $('#undo').onclick=()=>{if(!ar.classList.contains('ok')){placed.pop();draw()}};
  };round()}

  <div class="card"><div class="row-btns" style="justify-content:space-between"><h2 style="margin:0">Temas</h2><div class="seg">${[1,2,3,4].map(n=>`<button data-gy="${n}" class="${n===(GYEAR||a)?'on':''}">${n}.º ano</button>`).join('')}</div></div>
   <div class="scroll"><table class="t"><thead><tr><th>Tema</th><th style="text-align:right">Níveis</th><th>Certos à 1.ª</th></tr></thead><tbody>${rowsFor(GYEAR||a)}</tbody></table></div></div>
  <div class="card"><h2>🎯 Para treinar (${miss.length})</h2>${miss.length?`<p class="muted" style="font-size:14px">Exercícios em que a última tentativa não foi certa à primeira. Aparecem no “Desafio das contas difíceis” e nas revisões.</p><div class="scroll"><table class="t"><thead><tr><th>Tema</th><th>Exercício</th><th>Resposta</th></tr></thead><tbody>${miss.slice(0,40).map(id=>{const it=IT[id];return`<tr><td style="white-space:nowrap">${GICON[it.g]} ${it.g}</td><td>${esc(it.p==='Qual é a palavra?'||it.p==='Qual frase corresponde à imagem?'?(PIC[picWord(it)]||'')+' '+it.p:it.p)}</td><td><b>${esc(it.full||answerText(it))}</b></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">Nada pendente. 🎉</p>'}</div>
  <div class="card"><h2>Últimas sessões</h2>${p.log.length?`<table class="t"><tbody>${p.log.slice(-10).reverse().map(l=>`<tr><td style="white-space:nowrap">${fmtDate(l.t)}</td><td>${l.k==='hard'?'🎯 Contas difíceis':LV[l.k]?GICON[LV[l.k].g]+' '+esc(GN[LV[l.k].g])+' · nível '+LV[l.k].n:RV[l.k]?'🎪 '+(RV[l.k].last?'Grande revisão':'Revisão '+RV[l.k].n)+' · '+RV[l.k].ano+'.º ano':esc(l.k)}</td><td class="n">${l.ok}/${l.n}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Ainda sem sessões.</p>'}</div>`;
  box.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{GKID=b.dataset.gk;GYEAR=null;guProgress(box)});
  box.querySelectorAll('[data-gy]').forEach(b=>b.onclick=()=>{GYEAR=+b.dataset.gy;guProgress(box)});
  const ch=$('#clrHelp');if(ch)ch.onclick=()=>{p.help=[];save();guProgress(box)};
}
let GYEAR=null;
function guProfiles(box){
  box.innerHTML=`<div class="card"><h2>Perfis das crianças</h2><p class="muted">Cada criança tem o seu progresso e a sua caderneta. O ano escolhido define onde começa o mapa.</p>
  ${S.kids.map(k=>{const p=P(k);return`<div class="kidrow"><span class="avatar" style="width:48px;height:48px;font-size:28px">${k.av}</span><div style="flex:1"><b>${esc(k.name)}</b><div class="status">${k.ano}.º ano · ${Object.keys(p.lv).length} níveis · ${p.st.length+p.gold.length} autocolantes</div></div>
  <button class="btn alt small" data-ed="${k.id}">Editar</button><button class="btn alt small" data-rs="${k.id}">Recomeçar</button><button class="btn alt small" data-del="${k.id}">Apagar</button></div>`}).join('')||'<p>Sem perfis.</p>'}
  <button class="btn orange" id="addK2" style="margin-top:8px">➕ Adicionar criança</button></div>`;
  $('#addK2').onclick=()=>go('newkid');
  box.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>go('newkid',b.dataset.ed));
  const confirmDo=(txt,fn)=>modal(`<h2>Tem a certeza?</h2><p>${txt}</p><div class="row-btns"><button class="btn coral" id="cY">Sim</button><button class="btn alt" id="cN">Cancelar</button></div>`,(m,c)=>{m.querySelector('#cN').onclick=c;m.querySelector('#cY').onclick=()=>{c();fn();save();guProfiles(box)}});
  box.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{const k=S.kids.find(x=>x.id===b.dataset.rs);confirmDo(`Todo o progresso e os autocolantes de ${esc(k.name)} serão apagados.`,()=>{delete S.prog[k.id]})});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const k=S.kids.find(x=>x.id===b.dataset.del);confirmDo(`O perfil de ${esc(k.name)} e todo o seu progresso serão apagados.`,()=>{S.kids=S.kids.filter(x=>x!==k);delete S.prog[k.id];if(S.cur===k.id)S.cur=S.kids[0]?S.kids[0].id:null})});
}
function guGuide(box){
  box.innerHTML=`<div class="card"><h2>Como usar o Banco de cálculo</h2><ul>
  <li><b>Sessões curtas:</b> 1 ou 2 níveis por dia (8 exercícios cada) costumam chegar. Mais vale pouco e frequente do que muito de uma vez.</li>
  <li><b>Caderno ao lado:</b> nos temas de algoritmos (contas em pé) e problemas, a criança faz a conta no caderno e só depois escreve a resposta. A app não pede passos intermédios.</li>
  <li><b>Calculadora para confirmar:</b> o botão 🧮 abre uma calculadora simples (com prioridade das operações e parênteses). Depois de responder, “Confirmar na calculadora” refaz a conta e diz se a resposta da criança estava certa. Pode desligar a calculadora em ⚙️ Definições.</li>
  <li><b>Correção automática:</b> cada exercício aceita duas tentativas. À primeira falha a app dá uma pista; à segunda mostra a resposta certa. Só conta como “certo à primeira” quando acerta logo.</li>
  <li><b>Respostas com vírgula:</b> nos decimais, a criança escreve com vírgula (3,5). Espaços nos milhares são aceites (12 500 ou 12500).</li>
  <li><b>Revisões em jogo:</b> depois de cada 3 temas aparece uma revisão com jogos (balões, memória, certo ou errado, comboio dos números, contas rápidas). Usa primeiro os exercícios em que a criança errou.</li>
  <li><b>Contas difíceis:</b> o botão 🎯 no mapa junta até 8 exercícios em que a última tentativa não foi certa. Quando acerta, saem da lista.</li>
  <li><b>Fichas em papel:</b> em cada tema há um botão 🖨 que cria uma ficha A4 com exercícios do mesmo tema, e uma página de soluções opcional.</li>
  <li><b>Os números são uma orientação</b> para escolher o que treinar, não um diagnóstico. Se tiver preocupações, fale com o professor.</li></ul>
  <div class="grownup"><b>Sobre os exercícios:</b> ${BANK.items.length} exercícios originais, do 1.º ao 4.º ano, em ${Object.keys(BANK.groups).length} temas, organizados pelas Aprendizagens Essenciais de Matemática do 1.º ciclo (DGE, versão de março de 2026): números até 100 (1.º), 1000 (2.º), 10 000 (3.º) e 1 000 000 (4.º); adição e subtração; tabuadas do 2, 3, 4, 5 e 10 no 2.º ano e do 6, 7, 8 e 9 no 3.º; algoritmos da adição e subtração (3.º) e da multiplicação e divisão (4.º); frações, decimais e percentagens de referência; dinheiro, tempo, comprimento, massa, área e capacidade. A ordem dos temas acompanha a progressão habitual dos manuais adotados (por exemplo, PLIM! Matemática e Vamos aprender Matemática), mas os exercícios não são copiados de nenhum manual.</div></div>`}
function guSettings(box){const st=S.settings;
  box.innerHTML=`<div class="card"><h2>Som e voz</h2>
  <label class="toggle"><input type="checkbox" id="sV" ${st.voice?'checked':''}> Voz (ler instruções e contas)</label>
  <label class="toggle"><input type="checkbox" id="sA" ${st.autoInstr?'checked':''}> Ler a instrução automaticamente no início de cada nível</label>
  <label class="toggle"><input type="checkbox" id="sF" ${st.sfx?'checked':''}> Efeitos sonoros</label>
  <div class="toggle" style="border:0">Velocidade da voz <div class="seg">${[[0.75,'Lenta'],[0.9,'Normal'],[1.05,'Rápida']].map(([v,l])=>`<button data-rt="${v}" class="${st.rate===v?'on':''}">${l}</button>`).join('')}</div><button class="btn alt small" id="sTest">🔊 Testar</button></div>
  <p class="status">${ptVoice?'Voz em português europeu encontrada neste dispositivo.':'A voz depende do dispositivo. Se não ouvir português de Portugal, instale uma voz “Português (Portugal)” nas definições do sistema.'}</p></div>
  <div class="card"><h2>Calculadora</h2>
  <label class="toggle"><input type="checkbox" id="sC" ${st.calc?'checked':''}> Mostrar a calculadora 🧮 e o botão “Confirmar na calculadora”</label>
  <p class="status">Recomendado: a criança resolve primeiro sozinha e usa a calculadora só para confirmar. Desligue se preferir treino sem apoio.</p></div>
  <div class="card"><h2>Cópia de segurança</h2><p class="muted">O progresso fica guardado na sua conta claude.ai quando tem sessão iniciada, e também neste navegador. Para passar para outro dispositivo sem conta, copie o código e cole-o lá.</p>
  <div class="row-btns"><button class="btn alt small" id="bCopy">📋 Copiar código</button></div>
  <label class="f" for="bIn">Colar código de outro dispositivo</label><textarea class="txt" id="bIn" placeholder="Cole aqui o código"></textarea><div class="row-btns" style="margin-top:8px"><button class="btn small" id="bLoad">Repor progresso</button></div><p class="status" id="bMsg"></p></div>`;
  $('#sV').onchange=e=>{st.voice=e.target.checked;save();header()};$('#sC').onchange=e=>{st.calc=e.target.checked;save();header()};$('#sA').onchange=e=>{st.autoInstr=e.target.checked;save()};$('#sF').onchange=e=>{st.sfx=e.target.checked;save();header()};
  box.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{st.rate=+b.dataset.rt;save();guSettings(box)});
  $('#sTest').onclick=()=>{const v=st.voice;st.voice=true;speak('Olá! Vamos calcular. 7 + 5 = 12.');st.voice=v};
  $('#bCopy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));$('#bMsg').textContent='Código copiado.'}catch(e){$('#bIn').value=JSON.stringify(S);$('#bMsg').textContent='Selecione o texto na caixa e copie-o.'}};
  $('#bLoad').onclick=()=>{try{const d=JSON.parse($('#bIn').value);if(!Array.isArray(d.kids))throw 0;S=Object.assign(fresh(),d);save();$('#bMsg').textContent='Progresso reposto ('+S.kids.length+' perfis).'}catch(e){$('#bMsg').textContent='Este código não é válido.'}};
}

/* ============ boot ============ */
Promise.resolve(JSON.parse(document.getElementById('bankData').textContent)).then(d=>{BANK=d;buildLevels();go(kid()?'map':'kids')}).catch(()=>{app.innerHTML='<div class="card"><h2>Não foi possível carregar os exercícios.</h2><p>Recarregue a página.</p></div>'});
initRemote();
(async()=>{try{if(window.claude&&claude.use){DL=await claude.use('downloads');TTS=await claude.use('tts')}}catch(e){}})();
}
</script>
</body>
</html>
